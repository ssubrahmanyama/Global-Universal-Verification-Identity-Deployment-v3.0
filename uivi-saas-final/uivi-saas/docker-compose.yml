services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: uivi
      POSTGRES_PASSWORD: uivi
      POSTGRES_DB: uivi_master
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uivi"]
      interval: 5s
      retries: 10

  db-init:
    image: postgres:15-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: uivi
    volumes:
      - ./scripts/init-db.sh:/init-db.sh
    entrypoint: ["/bin/sh", "/init-db.sh"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      MASTER_DB_URL: "postgres://uivi:uivi@db:5432/uivi_master?sslmode=disable"
      TENANT_DB_HOST: "db"
      TENANT_DB_USER: "uivi"
      TENANT_DB_PASS: "uivi"
      JWT_SECRET: "uivi-saas-jwt-secret-change-in-prod"
      PORT: "8080"
      GIN_MODE: "release"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - ./frontend:/app/frontend:ro

volumes:
  pgdata:
